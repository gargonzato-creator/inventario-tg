name: Publicar en GitHub Pages
# Solo manual: GitHub Pages no está activado en este repo (activarlo en Settings > Pages > Source: GitHub Actions).
# Mientras tanto la app se publica en https://gargonzato-creator.github.io/inventario/
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar íconos PNG
        run: |
          for f in *.png.b64; do base64 -d "$f" > "${f%.b64}"; done
          mkdir -p _site
          cp -r index.html app.js styles.css sw.js catalogo.json manifest.webmanifest icon-*.png .nojekyll _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
